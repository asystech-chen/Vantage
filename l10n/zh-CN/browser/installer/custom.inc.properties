WINUPDATER_DESCRIPTION = Vantage WinUpdater 会在后台静默运行，自动将浏览器更新到包含最新安全修复和功能的新版本，让您始终使用最新、最安全的浏览器。$\r$\n$\r$\n您可以现在安装，也可以跳过并手动管理更新；之后如需移除，可随时通过 Windows 的“应用”列表（设置 → 应用）卸载 Vantage WinUpdater。
WINUPDATER_CHECKBOX_DESC = 安装用于后台自动更新 Vantage 的 WinUpdater 组件（推荐）
