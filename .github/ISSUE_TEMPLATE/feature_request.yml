name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: false
  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意自己实现并提 PR
      options:
        - 愿意
        - 愿意，但需要指导
        - 只想提建议
    validations:
      required: true
