name: PR Guard

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  needs-issue:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 PR 是否关联 issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const linked = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#\d+|#\d+/i.test(body);
            const label = 'needs-issue';
            const { owner, repo } = context.repo;

            if (linked) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: label });
              } catch (e) { /* 标签不存在，忽略 */ }
              core.info('已关联 issue，通过。');
              return;
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });

            const marker = '<!-- pr-guard -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            if (!comments.some(c => c.body && c.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `${marker}\n这条 PR 还没关联到 issue。\n\n本仓库要求**先提 issue、再提 PR**；没有关联 issue 的 PR 可能会被关闭。即使是小的修正，也请先开个 issue 说明一下，维护者处理起来会更快。补上 \`Fixes #编号\` 后，本条会自动更新。`
              });
            }
            core.warning('未检测到关联 issue（软提醒，不影响合并）。');
