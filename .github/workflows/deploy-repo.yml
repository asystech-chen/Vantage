name: 自动发布 APT/RPM 软件源

on:
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v3

      - name: 2. 安装打包和签名必备工具
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg rpm

      - name: 3. 导入 GPG 私钥并配置静默模式
        run: |
          echo "${{ secrets.LCX_GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --import private.key
          rm private.key
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5}')
          echo "GPG_KEY_ID=$KEY_ID" >> $GITHUB_ENV

      - name: 4. 自动拉取最新 Release 的包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo-root/pool
          # 只下载 deb 和 rpm，不碰 exe
          gh release download --pattern "*.deb" --pattern "*.rpm" --dir repo-root/pool/
          echo "已成功拉取最新安装包至 pool 目录："
          ls -lh repo-root/pool/

      - name: 5. 运行仓库签名和生成脚本
        run: |
          # 1. 基础配置：强制允许后台静默模式
          mkdir -p ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          
          # 2. 核心魔法：创建一个 GPG 替身，自动代填那一个“空格”密码
          mkdir -p /tmp/gpg-wrap
          echo '#!/bin/bash' > /tmp/gpg-wrap/gpg
          echo '/usr/bin/gpg --pinentry-mode loopback --passphrase " " "$@"' >> /tmp/gpg-wrap/gpg
          chmod +x /tmp/gpg-wrap/gpg
          
          # 把替身放到系统命令的最前面，接管所有的 gpg 调用
          export PATH="/tmp/gpg-wrap:$PATH"
          export GPG_KEY=$GPG_KEY_ID
          
          # 3. 治本之策：配置 RPM 本地签名宏，指定用你的私钥
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name $GPG_KEY_ID" >> ~/.rpmmacros
          
          # 4. 赶在生成源索引前，把下载的所有 rpm 包本体逐个盖上钢印
          find ./repo-root/pool -name "*.rpm" -exec rpm --addsign {} \;
          
          # 5. 执行你的原始生成脚本
          chmod +x ./scripts/signing/sign-repo.sh
          ./scripts/signing/sign-repo.sh $(pwd)/repo-root
          
      - name: 6. 同步推送至 Cloudflare R2 (双步无缝同步)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 阶段一：【安全覆盖】只增不减。先稳稳地把新版 deb/rpm 和全新的 repomd.xml/Packages 索引推上去。
          # 这一步保证了用户在更新软件时，绝对不会遇到 404 断档。
          aws s3 sync ./repo-root s3://vantage/vantage-release/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }}
          
          # 阶段二：【精准清理】此时新索引和新包已经绝对安全地躺在 R2 里了。
          # 再次执行同步并带上 --delete，专心去把那些已经不在索引里、也不在本地的旧版本包清理掉。
          aws s3 sync ./repo-root s3://vantage/vantage-release/ \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --delete \
            --exclude "keys/*" \
            --exclude "install.sh" \
            --exclude "*.exe"
