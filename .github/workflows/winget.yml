name: 半自动发布 Winget
on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入新版本号 (例如: 153.0.2)'
        required: true
      url_amd64:
        description: '请输入 AMD64 (x64) 版本的 R2 下载直链'
        required: true
      url_arm:
        description: '请输入 ARM 版本的 R2 下载直链'
        required: true

jobs:
  publish-to-winget:
    runs-on: windows-latest  # 关键修改：白嫖 GitHub 的 Windows 机器，不给师傅的服务器添乱
    steps:
      - name: 1. 下载微软官方 Winget 发版工具
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
        
      - name: 2. 自动下载包、计算哈希并提交 PR
        run: |
          .\wingetcreate.exe update ASYS.Vantage `
            --version ${{ github.event.inputs.version }} `
            --urls ${{ github.event.inputs.url_amd64 }} ${{ github.event.inputs.url_arm }} `
            --submit `
            --token ${{ secrets.WINGET_TOKEN }}
