name: 半自动发布 Winget
on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入新版本号 (例如: 153.0.2)'
        required: true
      url_amd64:
        description: '请输入 AMD64 (x64) 版本的 R2 下载直链'
        required: true
      url_arm:
        description: '请输入 ARM 版本的 R2 下载直链'
        required: true

jobs:
  publish-to-winget:
    runs-on: self-hosted  
    steps:
      - name: 自动计算哈希并提交 PR
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: 'ASYS.Vantage' 
          version: ${{ github.event.inputs.version }}
          # 这里把两个链接用逗号拼起来一起发给机器人
          urls: "${{ github.event.inputs.url_amd64 }},${{ github.event.inputs.url_arm }}"
          token: ${{ secrets.WINGET_TOKEN }}
