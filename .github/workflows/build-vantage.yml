name: Build Vantage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用 tag（如 v153.0.2）；留空 = 只编译、不发布（全量 5 平台）'
        required: false
        type: string
      linux-x64:
        description: '🐧 Linux x64'
        type: boolean
        default: true
      linux-arm64:
        description: '🐧 Linux arm64（交叉编译）'
        type: boolean
        default: false
      linux-loong64:
        description: '🐧 Linux loong64（交叉编译）'
        type: boolean
        default: false
      windows-x64:
        description: '🪟 Windows x64（交叉编译）'
        type: boolean
        default: false
      windows-arm64:
        description: '🪟 Windows arm64（交叉编译）'
        type: boolean
        default: false
      macos-x64:
        description: '🍎 macOS x64（交叉编译）'
        type: boolean
        default: false
      macos-arm64:
        description: '🍎 macOS arm64（交叉编译）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: 检查权限
        run: |
          ALLOWED="asystech-chen Liangchenxu"
          if echo "$ALLOWED" | grep -qw "${{ github.actor }}"; then
            echo "✅ 授权用户: ${{ github.actor }}"
          else
            echo "❌ ${{ github.actor }} 无权限，构建已拒绝"
            exit 1
          fi

  build:
    needs: authorize
    runs-on: [self-hosted, vantage-builder]
    timeout-minutes: 1440
    steps:
      - name: 加固 git 网络（HTTP/1.1，规避 HTTP2 framing 错误）
        run: git config --global http.version HTTP/1.1

      - name: 同步本地 mirror（增量拉取 GitHub，加速构建）
        run: |
          git -C /home/chen/git/vantage.git fetch origin \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" \
            || echo "⚠️ mirror 同步失败，将回退直连 GitHub"

      - name: Checkout（本地 mirror 优先，失败回退 GitHub）
        run: |
          REF="${{ github.event.inputs.tag || github.ref }}"
          # 规范化：refs/heads/X → X（--no-checkout 克隆后本地无 refs/heads/*，用短名自动跟踪）
          CHECKOUT="${REF#refs/heads/}"
          # 清空 workspace 内容（保留目录本身，后续步骤依赖 $GITHUB_WORKSPACE）
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true
          if git clone --no-checkout /home/chen/git/vantage.git "$GITHUB_WORKSPACE" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" checkout "$CHECKOUT"
            echo "✅ Checkout 完成（本地 mirror）"
          else
            echo "⚠️ 本地 mirror 不可用，回退直连 GitHub"
            git clone --no-checkout https://github.com/asystech-chen/Vantage.git "$GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" checkout "$CHECKOUT"
          fi

      - name: Build
        timeout-minutes: 1440
        env:
          # MSIX 封包走 home-nas 上的 HTTP 服务（scripts/msix-remote.sh）
          # MSIX_TOKEN 在仓库 Settings → Secrets 里配置；未配置时该步会跳过封包（不阻塞构建）
          MSIX_TOKEN: ${{ secrets.MSIX_TOKEN }}
          MSIX_URL: ${{ vars.MSIX_URL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGETS="linux-x64 linux-arm64 linux-loong64 windows-x64 windows-arm64"
          elif [ -z "${{ github.event.inputs.tag }}" ]; then
            # build-only：无 tag 手动触发 = 只编译（全量 5 平台），不建 tag/release
            echo ">>> build-only 模式：无 tag，全量编译全部平台"
            TARGETS="linux-x64 linux-arm64 linux-loong64 windows-x64 windows-arm64"
          else
            TARGETS=""
            [ "${{ github.event.inputs['linux-x64'] }}" = "true" ] && TARGETS="$TARGETS linux-x64"
            [ "${{ github.event.inputs['linux-arm64'] }}" = "true" ] && TARGETS="$TARGETS linux-arm64"
            [ "${{ github.event.inputs['linux-loong64'] }}" = "true" ] && TARGETS="$TARGETS linux-loong64"
            [ "${{ github.event.inputs['windows-x64'] }}" = "true" ] && TARGETS="$TARGETS windows-x64"
            [ "${{ github.event.inputs['windows-arm64'] }}" = "true" ] && TARGETS="$TARGETS windows-arm64"
            [ "${{ github.event.inputs['macos-x64'] }}" = "true" ] && TARGETS="$TARGETS macos-x64"
            [ "${{ github.event.inputs['macos-arm64'] }}" = "true" ] && TARGETS="$TARGETS macos-arm64"
          fi
          echo "编译目标: $TARGETS"
          ./build.sh $TARGETS

      - name: Create Release & Upload
        # build-only：无 tag 手动触发时跳过发布（不建 tag、不建 release）
        if: github.event_name == 'push' || github.event.inputs.tag != ''
        run: |
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GH_REPO="asystech-chen/Vantage"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # 收集构建产物：以构建生成的 SHA256SUMS 为权威清单（自动匹配当前版本），
          # 只排除 msix 预打包中间产物（*.msix-prepackage.zip），成品 *.msix 正常发布
          VERSION="${TAG#v}"
          shopt -s nullglob
          RELEASE_ASSETS=()
          FOUND=0
          if [ -f SHA256SUMS ]; then
            echo "📋 使用 SHA256SUMS 作为资产清单（版本 $VERSION）"
            while read -r _ f; do
              [ -n "$f" ] || continue
              case "$f" in
                *.msix-prepackage.zip)
                  echo "⏭️ 跳过 msix 预打包中间产物: $f"
                  continue
                  ;;
              esac
              if [ -f "$f" ]; then
                RELEASE_ASSETS+=("$f")
                FOUND=$((FOUND + 1))
              else
                echo "⚠️ SHA256SUMS 中列出的文件不存在: $f"
              fi
            done < SHA256SUMS
          else
            echo "❌ 未找到 SHA256SUMS（构建产物清单），无法创建 release"
            exit 1
          fi
          # 清单内正式产物一个都不存在 → 明确失败，避免静默只传 SHA256SUMS
          if [ $FOUND -eq 0 ]; then
            echo "❌ SHA256SUMS 中列出的产物全部缺失（runner 工作区被清理？），请先跑完整构建"
            exit 1
          fi
          # 附带校验和文件本身及其 GPG 签名
          RELEASE_ASSETS+=(SHA256SUMS)
          [ -f SHA256SUMS.asc ] && RELEASE_ASSETS+=(SHA256SUMS.asc)
          if [ ${#RELEASE_ASSETS[@]} -eq 0 ]; then
            echo "❌ 未找到 $VERSION 的构建产物，无法创建 release"
            exit 1
          fi
          echo "📦 待上传产物:"
          ls -lh "${RELEASE_ASSETS[@]}"

          # 从 CHANGELOG.md 提取对应版本日志
          awk -v ver="$VERSION" '
            /^# Vantage / {
              if (found) exit
              if (index($0, "Vantage " ver " ")) { found=1; next }
            }
            found
          ' CHANGELOG.md > /tmp/release-notes.md

          # 先建 release（不带资产），再并行上传各文件（规避单连接限速）
          # 新建发布一律标记为 pre-release，待验证通过后手动转正（GitHub 页面取消勾选 / gh release edit --prerelease=false）
          if [ -s /tmp/release-notes.md ]; then
            echo "使用 CHANGELOG.md 作为发布说明"
            gh release create "$TAG" --title "Vantage $TAG" --notes-file /tmp/release-notes.md --prerelease || {
              gh release view "$TAG" >/dev/null 2>&1 || { echo "❌ release 创建失败"; exit 1; }
              echo "⚠️ release 已存在，直接上传资产"
            }
          else
            echo "CHANGELOG 中未找到 $VERSION，使用自动生成"
            gh release create "$TAG" --title "Vantage $TAG" --generate-notes --prerelease || {
              gh release view "$TAG" >/dev/null 2>&1 || { echo "❌ release 创建失败"; exit 1; }
              echo "⚠️ release 已存在，直接上传资产"
            }
          fi

          # ── 上传（抗断版，2026-09-17）────────────────────────────────
          # 背景：经代理上传 100M+ 资产偶发 EOF，旧版 4 并发全量重传，任一文件失败就整步退出、
          #       发布缺资产，只能重跑 6~7 小时构建。
          # 策略（幂等，可反复跑，每次都只补差的）：
          #   1) 先拉线上资产，size 一致（有 digest 再对 sha256）→ 直接跳过，不重复推 1.6GB
          #   2) 其余文件 2 并发上传，单文件最多重试 3 次（15s / 30s 退避）
          #   3) 上传后再拉一次清单逐项核对 size + sha256，不符才判失败
          # 注：GitHub 资产上传不支持断点续传，所以「抗断」= 只传缺失 + 自动重试 + 上传后校验。
          CONC=2
          ATTEMPTS=3
          FAILED_LIST=/tmp/release-upload-failed.txt
          ASSETS_BEFORE=/tmp/release-assets-before.tsv
          ASSETS_AFTER=/tmp/release-assets-after.tsv
          rm -f "$FAILED_LIST"

          list_assets() {
            gh api "repos/$GH_REPO/releases/tags/$TAG" \
              --jq '.assets[] | "\(.name)\t\(.size)\t\(.digest // "-")"' > "$1" 2>/dev/null || : > "$1"
          }

          echo "📋 对账线上已有资产..."
          list_assets "$ASSETS_BEFORE"

          TO_UPLOAD=()
          SKIPPED=0
          for f in "${RELEASE_ASSETS[@]}"; do
            base=$(basename "$f"); size=$(stat -c%s "$f")
            line=$(awk -F'\t' -v n="$base" '$1==n{print; exit}' "$ASSETS_BEFORE")
            if [ -n "$line" ]; then
              rsize=$(printf '%s' "$line" | cut -f2)
              rdig=$(printf '%s' "$line" | cut -f3)
              if [ "$rsize" = "$size" ] && { [ "$rdig" = "-" ] || [ -z "$rdig" ] || [ "$rdig" = "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; }; then
                echo "⏭️ 跳过（已存在且一致）: $base"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi
              echo "♻️ 需重传（线上不一致）: $base"
            fi
            TO_UPLOAD+=("$f")
          done
          echo "📦 待上传 ${#TO_UPLOAD[@]} 个，跳过 ${SKIPPED} 个（共 ${#RELEASE_ASSETS[@]} 个）"

          if [ ${#TO_UPLOAD[@]} -gt 0 ]; then
            printf '%s\n' "${TO_UPLOAD[@]}" | xargs -P "$CONC" -I{} bash -c '
              tag="$1"; f="$2"; attempts="$3"; failed_list="$4"; i=1
              while [ "$i" -le "$attempts" ]; do
                echo "⬆️ 开始: $(basename "$f") ($(du -h "$f" | cut -f1)) [第 $i/$attempts 次]"
                t0=$(date +%s)
                gh release upload "$tag" "$f" --clobber 2>&1 | sed "s/^/    /"
                if [ "${PIPESTATUS[0]}" -eq 0 ]; then
                  echo "✅ 完成: $(basename "$f") ($(($(date +%s)-t0))s)"
                  exit 0
                fi
                echo "⚠️ 第 $i 次失败: $(basename "$f")"
                i=$((i + 1))
                if [ "$i" -le "$attempts" ]; then
                  if [ "$i" -eq 2 ]; then d=15; else d=30; fi
                  echo "⏳ ${d}s 后重试: $(basename "$f")"
                  sleep "$d"
                fi
              done
              echo "❌ 重试 $attempts 次仍失败: $(basename "$f")"
              echo "$f" >> "$failed_list"
              exit 1
            ' _ "$TAG" {} "$ATTEMPTS" "$FAILED_LIST" || true
          fi

          echo "🔍 上传后逐项校验（size + sha256）..."
          list_assets "$ASSETS_AFTER"
          BAD=0
          for f in "${RELEASE_ASSETS[@]}"; do
            base=$(basename "$f"); size=$(stat -c%s "$f")
            line=$(awk -F'\t' -v n="$base" '$1==n{print; exit}' "$ASSETS_AFTER")
            if [ -z "$line" ]; then echo "❌ 线上缺失: $base"; BAD=$((BAD + 1)); continue; fi
            rsize=$(printf '%s' "$line" | cut -f2)
            rdig=$(printf '%s' "$line" | cut -f3)
            if [ "$rsize" != "$size" ]; then echo "❌ size 不符: $base（线上 $rsize ≠ 本地 $size）"; BAD=$((BAD + 1)); continue; fi
            if [ "$rdig" != "-" ] && [ -n "$rdig" ] && [ "$rdig" != "sha256:$(sha256sum "$f" | cut -d' ' -f1)" ]; then
              echo "❌ sha256 不符: $base"; BAD=$((BAD + 1)); continue
            fi
            echo "✅ 校验通过: $base"
          done

          if [ "$BAD" -gt 0 ] || [ -s "$FAILED_LIST" ]; then
            echo "❌ 仍有 $BAD 项缺失/不一致。本步骤幂等，再跑一次 Release Only 只补这些差额即可。"
            exit 1
          fi
          echo "✅ 全部 ${#RELEASE_ASSETS[@]} 个资产上传完成并校验通过"
