name: Check GPG

on: workflow_dispatch

jobs:
  check:
    runs-on: [self-hosted, vantage-builder]
    steps:
      - name: Check GPG keyring
        run: |
          echo "=== GPG Secret Key ==="
          if gpg --list-secret-keys 907587D2812D7F8C; then
            echo "✅ KEY FOUND"
          else
            echo "❌ KEY NOT FOUND IN KEYRING"
          fi
          echo ""
          echo "=== Private key file ==="
          if [ -f ~/vantage-repo-private-key.asc ]; then
            ls -la ~/vantage-repo-private-key.asc
            echo "✅ FILE EXISTS"
          else
            echo "❌ FILE NOT FOUND"
          fi
