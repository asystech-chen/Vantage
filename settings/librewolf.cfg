  height: auto !important;
  z-index: 5 !important;
}
:root[vantage-sidebar-revamp][vantage-sidebar-floating] #browser > #sidebar-container {
  inset-inline-start: var(--chrome-window-gap, 4px) !important;
  border-radius: 10px !important;
  overflow: clip !important;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28) !important;
  background-color: light-dark(rgba(255, 255, 255, 0.72), rgba(29, 27, 31, 0.62)) !important;
  backdrop-filter: blur(18px) saturate(1.25) !important;
}
:root[vantage-sidebar-revamp][vantage-sidebar-floating] #browser > #sidebar-box {
  inset-inline-start: var(--vantage-sidebar-box-inset, 61px) !important;
  border-radius: 10px !important;
  overflow: clip !important;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28) !important;
  animation: vantage-sidebar-in 0.16s ease-out !important;
  background-color: light-dark(rgba(255, 255, 255, 0.72), rgba(29, 27, 31, 0.62)) !important;
  backdrop-filter: blur(18px) saturate(1.25) !important;
}
:root[vantage-sidebar-revamp][vantage-sidebar-floating] #browser > #sidebar-box #sidebar {
