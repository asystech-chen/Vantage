    // Vantage: 侧栏悬停浮层（仅本功能自动弹出时生效；classic / revamp 两套）
    // 整个浮层**不挑主题**：挂第三方主题时也保持 Vantage 外观（半透明/圆角/阴影/动画）——
    // 因为只在「悬停弹出」态（[vantage-sidebar-floating]）生效，不影响主题的常规侧栏。
    // classic：浮内容面板、工具条/分隔条归零；revamp：整条（工具条 + 内容页）浮层、盖在网页上。
    const SIDEBAR_OVERLAY_CSS = `
/* ===== Vantage: 侧栏悬停浮层（不挑主题） ===== */
/* 屏蔽原生 expand-on-hover 给内容区/内容页/工具条加的 margin。
   原生在 sidebar.visibility=expand-on-hover 下会给 #tabbrowser-tabbox 留
   margin-inline-start = calc(--sidebar-launcher-collapsed-width + gap)（给常驻工具条预留位置）。
   本功能是"浮层、永不推挤"，且收起时会把工具条隐藏——若不恒清这条 margin，收起后
   就会空出一条"折叠工具条宽度"的空白并挤占内容。故只在**功能启用期间**恒清（浮层态/收起态都清）；
   功能关闭时不带此属性 → 原生 expand-on-hover 行为完全不受影响。 */
:root[vantage-sidebar-hover-active] #browser > #tabbrowser-tabbox,
:root[vantage-sidebar-hover-active] #browser > #sidebar-box,
:root[vantage-sidebar-hover-active] #browser > #sidebar-container {
  margin-inline: 0 !important;
}
/* --- 经典侧栏（默认）：浮内容面板；工具条与分隔条归零（内容不被推挤） --- */
:root:not([vantage-sidebar-revamp])[vantage-sidebar-floating] #browser > #sidebar-container,
:root:not([vantage-sidebar-revamp])[vantage-sidebar-floating] #browser > #sidebar-splitter,
:root:not([vantage-sidebar-revamp])[vantage-sidebar-floating] #browser > #sidebar-launcher-splitter {
  width: 0 !important;
  min-width: 0 !important;
  max-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  overflow: hidden !important;
}
:root:not([vantage-sidebar-revamp])[vantage-sidebar-floating] #browser > #sidebar-box {
  position: absolute !important;
  top: var(--chrome-window-gap, 4px) !important;
  bottom: var(--chrome-window-gap, 4px) !important;
  inset-inline-start: var(--chrome-window-gap, 4px) !important;
  height: auto !important;
  z-index: 5 !important;
  border-radius: 10px !important;
  overflow: clip !important;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28) !important;
  animation: vantage-sidebar-in 0.16s ease-out !important;
  background-color: light-dark(rgba(255, 255, 255, 0.72), rgba(29, 27, 31, 0.62)) !important;
  backdrop-filter: blur(18px) saturate(1.25) !important;
}
:root:not([vantage-sidebar-revamp])[vantage-sidebar-floating] #browser > #sidebar-box #sidebar {
  background-color: transparent !important;
  box-shadow: none !important;
}
/* --- 新侧栏（revamp）：整条（工具条 + 内容页）浮层、盖在网页上、不推挤 --- */
:root[vantage-sidebar-revamp][vantage-sidebar-floating] #browser > #sidebar-container,
:root[vantage-sidebar-revamp][vantage-sidebar-floating] #browser > #sidebar-box {
  position: absolute !important;
