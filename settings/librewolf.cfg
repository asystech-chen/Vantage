/** [SECTION] LANGUAGE
 * 默认跟随系统语言：intl.locale.requested 默认置空（"" = 用系统语言，
 * 见 LocaleService::ReadRequestedLocales 的「OS locale」分支）。
 * Accept-Language 交给 Firefox 默认（chrome://global/locale/intl.properties，
 * 随当前语言包变化），不再强制。
 * 用户在设置里改语言 → 写 user pref，优先于 default，重启保持。
 * 注：spoof_english 仍用 pref() 以压过用户值（防指纹用途）。
 */
pref("privacy.spoof_english", 0);  // 0 = disabled, 2 = force en-US (fingerprinting protection)

// 默认跟随系统语言；用户选择优先且持久
//（旧版此处为 pref("intl.locale.requested", "zh-CN")，导致改语言后重启被还原）
defaultPref("intl.locale.requested", "");

// Optional: set search region to China (affects search suggestions)
pref("browser.search.region", "CN");

/** 一次性迁移（2026-09-27）：旧版用 pref() 把语言相关 pref 写进了 user 分支，
 * 造成「设置里改语言 → 重启被还原」。这里清除残留（仅在值等于旧版强制值时），
 * 只跑一次；之后语言跟随系统 / 用户选择。
 */
(function () {
  try {
    const MARKER = "vantage.locale.migrated";
    if (Services.prefs.getBoolPref(MARKER, false)) {
      return;
    }
    const stale = {
      "intl.locale.requested": "zh-CN",
      "intl.accept_languages": "zh-CN, zh, en-US, en",
      "general.useragent.locale": "zh-CN",
    };
    for (const name of Object.keys(stale)) {
      try {
        if (
          Services.prefs.prefHasUserValue(name) &&
          Services.prefs.getStringPref(name, "") === stale[name]
        ) {
          Services.prefs.clearUserPref(name);
        }
      } catch (e) {}
    }
    Services.prefs.setBoolPref(MARKER, true);
  } catch (e) {
    dump("Vantage locale migration failed: " + e + "\n");
  }
})();

