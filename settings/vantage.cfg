/** 一次性迁移（2026-09-27）：旧版用 pref() 把语言相关 pref 写进了 user 分支，
 * 造成「设置里改语言 → 重启被还原」。这里清除残留（仅在值等于旧版强制值时），
 * 只跑一次；之后语言跟随系统 / 用户选择。
 */
(function () {
  try {
    const MARKER = "vantage.locale.migrated";
    if (Services.prefs.getBoolPref(MARKER, false)) {
      return;
    }
    const stale = {
      "intl.locale.requested": "zh-CN",
      "intl.accept_languages": "zh-CN, zh, en-US, en",
      "general.useragent.locale": "zh-CN",
    };
    for (const name of Object.keys(stale)) {
      try {
        if (
          Services.prefs.prefHasUserValue(name) &&
          Services.prefs.getStringPref(name, "") === stale[name]
        ) {
          Services.prefs.clearUserPref(name);
        }
      } catch (e) {}
    }
    Services.prefs.setBoolPref(MARKER, true);
  } catch (e) {
    dump("Vantage locale migration failed: " + e + "\n");
  }
})();

