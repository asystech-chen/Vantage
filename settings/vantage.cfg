// 首次启动打开内置新手引导（about:onboarding，见 patches/ui-patches/vantage-onboarding.patch）
// LibreWolf 把 homepage_override.mstone 设为 ignore，welcome_url 永远不会触发。
// 这里用「prefs.js 是否存在」判断是否全新 profile，只给新 profile 打一次性标记；
// BrowserContentHandler 读到标记后返回 OVERRIDE_NEW_PROFILE，才会使用 welcome_url。
(function () {
  try {
    const SEEN = "vantage.profile.seen";
    if (Services.prefs.getBoolPref(SEEN, false)) {
      return;
    }
    Services.prefs.setBoolPref(SEEN, true);
    let isNew = false;
    try {
      const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
      file.append("prefs.js");
      isNew = !file.exists();
    } catch (e) {}
    if (
      isNew &&
      !Services.prefs.getBoolPref("vantage.onboarding.done", false)
    ) {
      Services.prefs.setBoolPref("vantage.onboarding.firstRun", true);
    }
  } catch (e) {}
})();
