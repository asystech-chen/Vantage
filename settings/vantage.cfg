/** INDEX
 *
 * The file is organized in categories, and each one has a number of sections:
 *
 *
 * - PRIVACY [ISOLATION, SANITIZING, CACHE AND STORAGE, HISTORY AND SESSION RESTORE, QUERY STRIPPING]

 * - NETWORKING [HTTPS, REFERERS, WEBRTC, PROXY, DNS, DOH, PREFETCHING AND SPECULATIVE CONNECTIONS]
 *
 * - FINGERPRINTING [RFP, WEBGL]
 *
 * - SECURITY [SITE ISOLATION, CERTIFICATES, TLS/SSL, PERMISSIONS, SAFE BROWSING, OTHERS]
 *
 * - REGION [LOCATION, LANGUAGE]
 *
 * - BEHAVIOR [DRM, SEARCH AND URLBAR, DOWNLOADS, AUTOPLAY, POP-UPS AND WINDOWS, MOUSE, MACHINE LEARNING]
 *
 * - EXTENSIONS [USER INSTALLED, SYSTEM, EXTENSION FIREWALL]
 *
 * - BUILT-IN FEATURES [UPDATER, SYNC, LOCKWISE, CONTAINERS, DEVTOOLS, SHOPPING, OTHERS]
 *
 * - UI [BRANDING, HANDLERS, FIRST LAUNCH, NEW TAB PAGE, ABOUT, RECOMMENDED, OTHERS]
 *
 * - TELEMETRY
 *
 * - WINDOWS [UPDATES, OTHERS]
 *
 * - LIBREWOLF []
 *
 */
// @VANTAGE_BLOCK:2@
lockPref("privacy.trackingprotection.allow_list.hasMigratedCategoryPrefs", true);

/** 一次性清理（2026-09-29）：allow-list 旧迁移残留
 * Firefox 的 maybeMigrateCategoryPrefs() 会把 strict/custom 用户的 baseline/convenience 两个
 * allow list 写成 user pref = false；user pref 优先于 defaultPref，导致「修复严重网站问题」被
 * 永久关闭，GitHub 等站点无法访问。上面的 lockPref 只能挡新迁移，这里清掉旧 profile 的残留：
 * 仅当两个 pref 都是 user pref 且都为 false（迁移的签名）时清除，只跑一次；用户手动只关掉
 * baseline 时 convenience 不是 user pref，不会被误清。
 */
(function () {
  try {
    const MARKER = "vantage.allowlist.migrationCleaned";
    if (Services.prefs.getBoolPref(MARKER, false)) {
      return;
    }
    const BASELINE =
      "privacy.trackingprotection.allow_list.baseline.enabled";
    const CONVENIENCE =
      "privacy.trackingprotection.allow_list.convenience.enabled";
    if (
      Services.prefs.prefHasUserValue(BASELINE) &&
      !Services.prefs.getBoolPref(BASELINE) &&
      Services.prefs.prefHasUserValue(CONVENIENCE) &&
      !Services.prefs.getBoolPref(CONVENIENCE)
    ) {
      Services.prefs.clearUserPref(BASELINE);
      Services.prefs.clearUserPref(CONVENIENCE);
    }
    Services.prefs.setBoolPref(MARKER, true);
  } catch (e) {
    dump("Vantage allow-list cleanup failed: " + e + "\n");
  }
})();
