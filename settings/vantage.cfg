    const THEME_FILE = "userChrome.css";
    const CONTENT_FILE = "userContent.css";

    function getChromeDir() {
      let profD = Services.dirsvc.get("ProfD", Ci.nsIFile);
      let chromeDir = profD.clone();
      chromeDir.append("chrome");
      if (!chromeDir.exists()) {
        chromeDir.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
      }
      return chromeDir;
    }

    function readFile(aFile) {
      try {
        let { NetUtil } = ChromeUtils.importESModule("resource://gre/modules/NetUtil.sys.mjs");
        let fis = Cc["@mozilla.org/network/file-input-stream;1"]
                    .createInstance(Ci.nsIFileInputStream);
        fis.init(aFile, -1, -1, 0);
        let str = NetUtil.readInputStreamToString(fis, fis.available(), { charset: "UTF-8" });
        fis.close();
        return str;
      } catch (e) { return ""; }
    }

    // 只认 Vantage 自己写过的文件（内容含 Vantage 标记）
    function isOurFile(aFile) {
      try { return aFile.exists() && readFile(aFile).includes("Vantage"); }
      catch (e) { return false; }
    }

    function removeIfOurs(aFile) {
      try {
        if (isOurFile(aFile)) { aFile.remove(false); return true; }
      } catch (e) {}
      return false;
    }

    function chromeFile(name) {
      let file = getChromeDir().clone();
      file.append(name);
      return file;
    }

    function writeContentThemeFile() {
      try {
        let file = chromeFile(CONTENT_FILE);
        // 用户自己的 userContent.css：绝不覆盖
        if (file.exists() && !isOurFile(file)) return false;
        let foStream = Cc["@mozilla.org/network/file-output-stream;1"]
                       .createInstance(Ci.nsIFileOutputStream);
        foStream.init(file, 0x02 | 0x08 | 0x20, 0o644, 0);
        let converter = Cc["@mozilla.org/intl/converter-output-stream;1"]
                        .createInstance(Ci.nsIConverterOutputStream);
        converter.init(foStream, "UTF-8");
        converter.writeString(CONTENT_CSS);
        converter.close();
        foStream.close();
        return true;
      } catch (e) { return false; }
    }

    function applyContentTheme() {
      Services.prefs.setBoolPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
      writeContentThemeFile();
    }

    // 旧版本把浏览器界面 CSS 写在 userChrome.css 里；升级后删掉自己那份，
    // 让源码里的 vantage-theme.css 接管（用户自己的文件不动）。
    function cleanupLegacyChrome() {
      removeIfOurs(chromeFile(THEME_FILE));
    }

    Services.prefs.addObserver("vantage.theme.enabled",
      { observe(subject, topic, data) {
        if (Services.prefs.getBoolPref("vantage.theme.enabled", true)) {
          applyContentTheme();
        } else {
          removeIfOurs(chromeFile(CONTENT_FILE));
        }
      }}
    );

    // 启动时：清理旧 userChrome.css；主题开启时写 content 样式
    cleanupLegacyChrome();
    if (Services.prefs.getBoolPref("vantage.theme.enabled", true)) {
      applyContentTheme();
    }

  } catch (e) {}
})();

// ---- 自动更新检查 ----


defaultPref("vantage.updateCheck.enabled", true);
defaultPref("vantage.updateCheck.dismissedVersion", "");
defaultPref("vantage.aboutMenu.checkVersion", true);
defaultPref("vantage.aboutMenu.versionCheckUrl", "https://asystech.cn/vantage/releases.json");
defaultPref("vantage.aboutMenu.downloadPageUrl", "https://asystech.cn/vantage/vdownload.html");

(function () {
  try {
    // ---- 工具函数 ----

    function isNewerVersion(newVer, oldVer) {
      let [oldV, oldR] = oldVer.replace(/^v/, "").split("-");
      let [newV, newR] = newVer.replace(/^v/, "").split("-");
      if (!oldR) oldR = "0";
      if (!newR) newR = "0";
      let oP = oldV.split("."), nP = newV.split(".");
      for (let i = 0; i < nP.length; i++) {
        let o = Number(oP[i] || "0"), n = Number(nP[i]);
        if (n > o) return true;
        if (n < o) return false;
      }
      return Number(newR) > Number(oldR);
    }

    function getActiveBrowserWindow() {
      // 优先用 getMostRecentWindow，subject 在某些版本可能不是 window
      let win = Services.wm.getMostRecentWindow("navigator:browser");
      if (!win || win.closed) {
        // 回退：遍历所有浏览器窗口
        let wins = Services.wm.getEnumerator("navigator:browser");
        while (wins.hasMoreElements()) {
          let w = wins.getNext();
          if (w && !w.closed) return w;
        }
      }
      return win;
    }

    // ---- 核心：执行一次更新检查 ----

    function doUpdateCheck() {
      if (!Services.prefs.getBoolPref("vantage.updateCheck.enabled", true)) return;

      let dismissedVersion = Services.prefs.getStringPref("vantage.updateCheck.dismissedVersion", "");
      let apiUrl = Services.prefs.getStringPref(
        "vantage.aboutMenu.versionCheckUrl",
        "https://asystech.cn/vantage/releases.json"
      );
      let downloadPage = Services.prefs.getStringPref(
        "vantage.aboutMenu.downloadPageUrl",
        "https://asystech.cn/vantage/vdownload.html"
      );

      // NetUtil.asyncFetch (autoconfig 沙箱可用 ChromeUtils.importESModule)
      let NetUtil;
      try {
        ({ NetUtil } = ChromeUtils.importESModule("resource://gre/modules/NetUtil.sys.mjs"));
      } catch (e) {
        return;
      }
      let uri = Services.io.newURI(apiUrl);
      NetUtil.asyncFetch(
        { uri, loadUsingSystemPrincipal: true },
        function (inputStream, status) {
          if (!Components.isSuccessCode(status)) {
            dump("Vantage update check HTTP " + status + "\n");
            return;
          }
          let latest, name;
          try {
            let json = NetUtil.readInputStreamToString(inputStream, inputStream.available());
            // 绕过 JSON.parse，正则直接提取（避免 autoconfig 沙箱 JSON 解析问题）
            let tagMatch = json.match(/"tag_name"\s*:\s*"([^"]+)"/);
            let nameMatch = json.match(/"name"\s*:\s*"([^"]+)"/);
            latest = tagMatch ? tagMatch[1] : null;
            name = nameMatch ? nameMatch[1] : null;
            if (!latest) return;
          } catch (e) { return; }
          let current = Services.appinfo.version;
          if (dismissedVersion === latest) return;
          if (!isNewerVersion(latest, "v" + current)) return;

          let win = getActiveBrowserWindow();
          if (!win) return;

          let versionName = latest;
          let message = "发现新版本：Vantage " + latest.replace(/^v/, "");
          let buttons = [
            {
              label: "前往下载",
              accessKey: "D",
              callback: () => {
                win.openWebLinkIn(downloadPage, "tab");
              },
            },
            {
              label: "忽略此版本",
              accessKey: "I",
              callback: () => {
                Services.prefs.setStringPref("vantage.updateCheck.dismissedVersion", latest);
              },
            },
          ];

          let notifyBox = win.gNotificationBox;
          if (!notifyBox) return;

          notifyBox.appendNotification(
            "vantage-update-available",
            {
              label: message,
              priority: notifyBox.PRIORITY_INFO_MEDIUM,
            },
            buttons
          );
        }
      );
    }

    // ---- 启动时检查 (browser-delayed-startup-finished) ----

    Services.obs.addObserver(
      { observe(subject, topic, data) {
        if (topic !== "browser-delayed-startup-finished") return;
        doUpdateCheck();
        // 工具栏按钮迁移（老 profile 一次性补齐，用户之后可自由调整）：
        // - screenshot-button：Firefox 自带截图（Easy Screenshot 已被 blocked 的替代）
        // - undo-close-button：恢复最近关闭标签/窗口
        // 新 profile 的 defaultPlacements 自带这两个按钮；老 profile 升级后不会自动出现，
        // 这里一次性补齐。全部处理完成才标记 migrated（widget 未注册时下次启动重试）。
        try {
          if (Services.prefs.getBoolPref("vantage.toolbar.buttons.migrated", false)) return;
          const { CustomizableUI } = ChromeUtils.importESModule(
            "moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs"
          );
          // 确保截图 widget 已注册：ScreenshotsUtils 是懒加载，delayed-startup 时可能未初始化
          try {
            const { ScreenshotsUtils } = ChromeUtils.importESModule(
              "moz-src:///browser/components/screenshots/ScreenshotsUtils.sys.mjs"
            );
            if (typeof ScreenshotsUtils.initialize === "function") {
              ScreenshotsUtils.initialize();
            }
          } catch (e) {
            dump("Vantage screenshot widget init failed: " + e + "\n");
          }
          let allReady = true;
          for (const id of ["screenshot-button", "undo-close-button"]) {
            const widget = CustomizableUI.getWidget(id);
            if (widget && widget.provider === CustomizableUI.PROVIDER_API) {
              if (!CustomizableUI.getPlacementOfWidget(id)) {
                // 放在 downloads-button 之后（对齐默认布局位置）
                const anchor = CustomizableUI.getPlacementOfWidget("downloads-button");
                CustomizableUI.addWidgetToArea(
                  id,
                  CustomizableUI.AREA_NAVBAR,
                  anchor ? anchor.position + 1 : undefined
                );
              }
            } else {
              allReady = false; // widget 尚未注册，下次启动再试
            }
          }
          if (allReady) {
            Services.prefs.setBoolPref("vantage.toolbar.buttons.migrated", true);
          }
        } catch (e) {
          dump("Vantage toolbar button migration failed: " + e + "\n");
        }
      }},
      "browser-delayed-startup-finished"
    );

    // ---- 响应 pref-pane 开关 ----

    Services.prefs.addObserver("vantage.updateCheck.enabled",
      { observe(subject, topic, data) {
        if (data === "vantage.updateCheck.enabled" &&
            Services.prefs.getBoolPref("vantage.updateCheck.enabled", true)) {
          doUpdateCheck();
        }
      }}
    );

  } catch (e) {
    dump("Vantage update check init failed: " + e + "\n");
  }
})();

/** ------------------------------
 * [SECTION] VANTAGE: COPY AS MARKDOWN LINK
 * -------------------------------
 * 右键页面 / 链接 / 标签页 → 复制 "[标题](URL)" 到剪贴板。
 * 纯 autoconfig（无扩展、无补丁）；label 内置在 JS 里，按系统语言输出简中/繁中/英文。
 * 另：兜底隐藏未正常构建的 AI 聊天空子菜单（context-ask-chat / context_askChat）。
 */
(function () {
  try {
    const MENU_ID = "vantage-copy-mdlink";
    const TAB_MENU_ID = "vantage-copy-mdlink-tab";

    function tr() {
      let loc = "";
      try { loc = Services.locale.appLocaleAsBCP47 || ""; } catch (e) {}
      if (loc.startsWith("zh-Hant") || loc.startsWith("zh-TW") || loc.startsWith("zh-MS")) {
        return "複製為 Markdown 連結";
      }
      if (loc.startsWith("zh")) {
        return "复制为 Markdown 链接";
      }
      return "Copy as Markdown Link";
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/\r?\n/g, " ")
        .replace(/([\[\]])/g, "\\$1");
    }

    function toMarkdown(text, url) {
      let t = esc(text);
      if (!t) t = esc(url);
      return "[" + t + "](" + url + ")";
    }

    function copyText(text) {
      try {
        Components.classes["@mozilla.org/widget/clipboardhelper;1"]
          .getService(Components.interfaces.nsIClipboardHelper)
          .copyString(text);
      } catch (e) {
        dump("Vantage copy-mdlink clipboard failed: " + e + "\n");
      }
    }

    // Vantage：隐藏右键菜单里的 AI 聊天子菜单（context-ask-chat / context_askChat）。
    // 上游在开启 AI 后会显示这个“询问 AI”子菜单；Vantage 不要它。
    function hideAskChat(doc, id) {
      try {
        let m = doc.getElementById(id);
        if (m) m.hidden = true;
      } catch (e) {}
    }

    function initWindow(win) {
      let doc = win.document;
      if (!doc) return;

      // -- 内容区右键菜单（放进复制粘贴那一组，末尾分隔符之前）--
      let menu = doc.getElementById("contentAreaContextMenu");
      if (menu && !doc.getElementById(MENU_ID)) {
        let item = doc.createXULElement("menuitem");
        item.id = MENU_ID;
        item.setAttribute("label", tr());
        menu.addEventListener("popupshowing", (e) => {
          if (e.target !== menu) return;
          let cm = win.gContextMenu, url = "", text = "";
          if (cm && cm.onLink && cm.linkURL) {
            url = cm.linkURL; text = cm.linkTextStr || "";
          } else {
            url = win.gBrowser && win.gBrowser.currentURI ? win.gBrowser.currentURI.spec : "";
            text = win.gBrowser ? win.gBrowser.contentTitle : "";
          }
          item.setAttribute("data-md-url", url);
          item.setAttribute("data-md-text", text);
          hideAskChat(doc, "context-ask-chat");
        });
        item.addEventListener("command", () => {
          let cm = win.gContextMenu, url = "", text = "";
          if (cm && cm.onLink && cm.linkURL) {
            url = cm.linkURL; text = cm.linkTextStr || "";
          }
          if (!url) url = item.getAttribute("data-md-url") || "";
          if (!text) text = item.getAttribute("data-md-text") || "";
          if (url) copyText(toMarkdown(text, url));
        });
        let anchor = doc.getElementById("context-sep-selectall");
        if (anchor && anchor.parentNode === menu) {
          menu.insertBefore(item, anchor);
        } else {
          menu.appendChild(item);
        }
      }

      // -- 标签页右键菜单（跟在“复制标签页”近旁）--
      let tabMenu = doc.getElementById("tabContextMenu");
      if (tabMenu && !doc.getElementById(TAB_MENU_ID)) {
        let titem = doc.createXULElement("menuitem");
        titem.id = TAB_MENU_ID;
        titem.setAttribute("label", tr());
        tabMenu.addEventListener("popupshowing", (e) => {
          if (e.target !== tabMenu) return;
          let tab = win.TabContextMenu && win.TabContextMenu.contextTab;
          let uri = tab && tab.linkedBrowser ? tab.linkedBrowser.currentURI : null;
          titem.setAttribute("data-md-url", uri ? uri.spec : "");
          titem.setAttribute("data-md-text", tab ? tab.label : "");
          hideAskChat(doc, "context_askChat");
        });
        titem.addEventListener("command", () => {
          let tab = win.TabContextMenu && win.TabContextMenu.contextTab;
          let url = "", text = "";
          if (tab && tab.linkedBrowser && tab.linkedBrowser.currentURI) {
            url = tab.linkedBrowser.currentURI.spec; text = tab.label || "";
          }
          if (!url) url = titem.getAttribute("data-md-url") || "";
          if (!text) text = titem.getAttribute("data-md-text") || "";
          if (url) copyText(toMarkdown(text, url));
        });
        let dup = doc.getElementById("context_duplicateTabs") ||
                  doc.getElementById("context_duplicateTab");
        if (dup && dup.parentNode === tabMenu) {
          dup.after(titem);
        } else {
          tabMenu.appendChild(titem);
        }
      }
    }

    Services.obs.addObserver(
      { observe(subject, topic, data) {
        if (topic !== "browser-delayed-startup-finished") return;
        try {
          let win = subject;
          if (!win || !win.document) {
            win = Services.wm.getMostRecentWindow("navigator:browser");
          }
          if (win) initWindow(win);
        } catch (e) {
          dump("Vantage copy-mdlink init failed: " + e + "\n");
        }
      }},
      "browser-delayed-startup-finished"
    );
  } catch (e) {
    dump("Vantage copy-mdlink setup failed: " + e + "\n");
  }
})();

/** ------------------------------
 * [SECTION] VANTAGE: 侧栏边缘悬停自动弹出
 * 左边缘热区 → 弹出侧栏浮层（盖在网页上、不推挤）。总开关开启时：
 *  - 经典侧栏（sidebar.revamp=false，默认）：浮内容面板；任何入口打开都统一成弹层。
 *  - 新侧栏（sidebar.revamp=true）：整条（工具条 + 内容页）浮层；收起时若内容页
 *    开着则下次恢复同一内容页，否则只弹工具条（用户点内容页 × 关闭即属后者）。
 * 收起只在：点击侧栏外、Esc；鼠标移开不收起。纯 autoconfig。
 * pref: vantage.sidebar.hover-autohide.enabled（默认开）/ .hotzone（默认 4px）
 */
(function () {
  try {
    const XUL_NS = "http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul";
    const PREF_ENABLED = "vantage.sidebar.hover-autohide.enabled";
    const PREF_HOTZONE = "vantage.sidebar.hover-autohide.hotzone";

    function isEnabled() {
      try { return Services.prefs.getBoolPref(PREF_ENABLED, true); } catch (e) { return true; }
    }
    function hotzonePx() {
      try { return Services.prefs.getIntPref(PREF_HOTZONE, 4); } catch (e) { return 4; }
    }
    function isRevamp() {
      try { return Services.prefs.getBoolPref("sidebar.revamp", false); } catch (e) { return false; }
    }
    function visibilitySetting() {
      try { return Services.prefs.getStringPref("sidebar.visibility", "always-show"); } catch (e) { return "always-show"; }
    }

    function initWindow(win) {
      try {
        let doc = win.document;
        if (!doc || doc.documentElement.hasAttribute("vantage-sidebar-hover")) return;
        doc.documentElement.setAttribute("vantage-sidebar-hover", "1");

        // 供 CSS 分流：当前是否新侧栏（revamp）
        function syncRevampAttr() {
          if (isRevamp()) doc.documentElement.setAttribute("vantage-sidebar-revamp", "1");
          else doc.documentElement.removeAttribute("vantage-sidebar-revamp");
        }
        syncRevampAttr();

        // 供 CSS 分流：本功能是否启用——启用期间恒清原生给内容区留的工具条宽度 margin（不推挤）。
        function syncActiveAttr() {
          if (isEnabled()) doc.documentElement.setAttribute("vantage-sidebar-hover-active", "1");
          else doc.documentElement.removeAttribute("vantage-sidebar-hover-active");
        }
        syncActiveAttr();

        // 仅 revamp 模式下 sidebar.visibility=always-show 才表示"侧栏常驻"（需让位给原生）。
        function nativeAlwaysShow() {
          try {
            if (!isRevamp()) return false;
            return visibilitySetting() === "always-show";
          } catch (e) { return false; }
        }
        // 新侧栏"硬做"：忽略 visibility 让位；经典侧栏按原规则（revamp=false 时 nativeAlwaysShow 恒 false）。
        function popupMode() { return isEnabled() && (isRevamp() || !nativeAlwaysShow()); }

        let hot = doc.createElementNS(XUL_NS, "box");
        hot.id = "vantage-sidebar-hotzone";
        hot.setAttribute("style",
          "position:fixed;top:0;bottom:0;left:0;width:" + hotzonePx() +
          "px;z-index:2147483647;background:transparent;pointer-events:auto;");
        doc.documentElement.appendChild(hot);

        let autoOpened = false;
        let hoverOpened = false;
        function ctrl() { return win.SidebarController; }
        function panelOpen() { let c = ctrl(); return !!(c && c._state && c._state.panelOpen); }
        function box() { return doc.getElementById("sidebar-box"); }
        function container() { return doc.getElementById("sidebar-container"); }
        function isFloating() { return doc.documentElement.hasAttribute("vantage-sidebar-floating"); }
        function setFloating(on) {
          if (on) doc.documentElement.setAttribute("vantage-sidebar-floating", "1");
          else doc.documentElement.removeAttribute("vantage-sidebar-floating");
        }
        // 记录工具条实际宽度（供 CSS 定位内容页；原生 --sidebar-launcher-collapsed-width 在此模式下未必设置）
        function syncLauncherWidth() {
          try {
            let cont = container();
            if (cont && !cont.hidden) {
              let w = cont.getBoundingClientRect().width;
              if (w > 0) {
                let gap = 4;
                try { let g = parseFloat(getComputedStyle(doc.getElementById("browser")).getPropertyValue("--chrome-window-gap")); if (g >= 0) gap = g; } catch (e) {}
                doc.documentElement.style.setProperty("--vantage-sidebar-box-inset", (gap + w + gap) + "px");
              }
            }
          } catch (e) {}
        }
        function markFloating() {
          syncLauncherWidth();
          if (!isFloating()) setFloating(true);
          autoOpened = true;
        }

        function isInsideSidebar(t) {
          if (!t) return false;
          for (let el of [box(), container(), doc.getElementById("sidebar")]) {
            if (el && (el === t || el.contains(t))) return true;
          }
          let sbr = doc.getElementById("sidebar");
          try { let sd = sbr && sbr.contentDocument; if (sd && t.ownerDocument === sd) return true; } catch (e) {}
          return false;
        }
        function inPopup(t) {
          try { return !!(t && t.closest && t.closest("menupopup, panel, popup, tooltip")); } catch (e) { return false; }
        }

        // ---------- 经典侧栏 ----------
        function openClassic() {
          let c = ctrl();
          if (!c || autoOpened || panelOpen()) return;
          hoverOpened = true;
          markFloating();
          let cmd = c.lastOpenedId || (c._state && c._state.command) || "viewHistorySidebar";
          try { c.toggle(cmd); } catch (e) { dump("VSH show fail " + e + "\n"); }
        }
        function closeClassic() {
          let c = ctrl();
          let saved = c && (c.lastOpenedId || (c._state && c._state.command));
          autoOpened = false;
          setFloating(false);
          try {
            if (c && c.isOpen) c.hide();
            if (c && c._state) c._state.launcherVisible = false;
            if (c && saved) c.lastOpenedId = saved;
          } catch (e) {}
        }

        // ---------- 新侧栏 ----------
        // 弹出：显示工具条；若上次内容页开着（_state.command 非空）则一并恢复。
        function openRevamp() {
          let c = ctrl();
          if (!c || !c._state) return;
          if (autoOpened) return;
          if (c._state.launcherVisible && (c._state.panelOpen || !c._state.command)) return;
          hoverOpened = true;
          try { c._state.launcherVisible = true; } catch (e) { dump("VSH show launcher fail " + e + "\n"); }
          markFloating();
          let cmd = c._state.command;
          if (cmd) { try { Promise.resolve(c.show(cmd)).catch(() => {}); } catch (e) {} }
        }
        // 收起：整体隐藏；保留 _state.command（有内容页则下次恢复，否则只弹工具条）。
        function closeRevamp() {
          let c = ctrl();
          if (!c) return;
          autoOpened = false;
          setFloating(false);
          try {
            if (c._state && c._state.panelOpen) c.hide({ dismissPanel: false });
            if (c._state) c._state.launcherVisible = false;
          } catch (e) {}
        }

        function openSidebar() { if (isRevamp()) openRevamp(); else openClassic(); }
        function closeSidebar() { if (isRevamp()) closeRevamp(); else closeClassic(); }

        hot.addEventListener("mouseenter", function () { if (popupMode()) openSidebar(); });
        hot.addEventListener("mousemove", function () { if (popupMode()) openSidebar(); });

        // 收起：点击侧栏以外的任何地方（含网页内容区、工具栏、标签栏）
        doc.addEventListener("mousedown", function (e) {
          if (!autoOpened) return;
          if (isInsideSidebar(e.target) || inPopup(e.target)) return;
          closeSidebar();
        }, true);
        // 收起：Esc
        doc.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && autoOpened) closeSidebar();
        }, true);

        // 拦截所有"打开侧栏"（工具栏按钮/会话恢复等），瞬时转成浮层，避免先停靠再转换的闪现。
        try {
          let c0 = ctrl();
          if (c0 && c0._show && !c0.__vantageFloatPatched) {
            let origShow = c0._show.bind(c0);
            c0._show = function (commandID) {
              try { if (popupMode()) markFloating(); } catch (e) {}
              return origShow(commandID);
            };
            c0.__vantageFloatPatched = true;
          }
        } catch (e) {}

        // 状态同步【兼底】：任何方式打开的侧栏都转成浮层；关了就清标记。
        // 新侧栏下"工具条可见"也算打开（面板可关闭、只剩工具条）。
        win.setInterval(function () {
          try {
            syncRevampAttr();
            syncActiveAttr();
            if (!popupMode()) return;
            let c = ctrl();
            if (!c || !c._state) return;
            let open = c._state.panelOpen || (isRevamp() && c._state.launcherVisible);
            if (open) {
              if (!isFloating()) markFloating();
              else syncLauncherWidth();
            } else if (isFloating()) {
              setFloating(false);
              if (autoOpened) autoOpened = false;
            } else if (autoOpened) {
              autoOpened = false;
            }
          } catch (e) {}
        }, 300);

        // 启动阶段：上次退出时侧栏开着会被还原 → 立即收起（回到隐藏态，靠 hover 再弹）。
        // 内容页开着的保留 _state.command，下次 hover 会恢复同一内容页。
        function ensureHiddenAtStartup() {
          if (!popupMode() || hoverOpened) return;
          let c = ctrl();
          if (!c || !c._state) return;
          if (isRevamp()) {
            if (!c._state.panelOpen && !c._state.launcherVisible) return;
            try {
              if (c._state.panelOpen) c.hide({ dismissPanel: false });
              c._state.launcherVisible = false;
            } catch (e) {}
          } else {
            if (!c._state.panelOpen) return;
            let saved = c.lastOpenedId || c._state.command;
            try { c.hide(); } catch (e) {}
            if (c._state) c._state.launcherVisible = false;
            if (saved) c.lastOpenedId = saved;
          }
          setFloating(false);
        }
        try {
          Services.obs.addObserver({
            observe(subj, topic) {
              if (subj !== win) return;
              win.setTimeout(ensureHiddenAtStartup, 100);
            },
          }, "sessionstore-single-window-restored");
        } catch (e) {}
        for (let _d of [300, 700, 1200, 2500]) {
          win.setTimeout(ensureHiddenAtStartup, _d);
        }
      } catch (e) {
        dump("VSH init fail " + e + "\n");
      }
    }

    Services.obs.addObserver(
      { observe(subject, topic) {
        if (topic !== "browser-delayed-startup-finished") return;
        try {
          let win = subject;
          if (!win || !win.document) win = Services.wm.getMostRecentWindow("navigator:browser");
          if (win) initWindow(win);
        } catch (e) {}
      }},
      "browser-delayed-startup-finished"
    );
  } catch (e) {
    dump("VSH setup fail " + e + "\n");
  }
})();

/** ------------------------------
 * [SECTION] VANTAGE: OPEN IN INTERNET EXPLORER (Windows only)
 * -------------------------------
 * 右键页面 / 链接 / 标签页 → 用 IE 打开。纯 autoconfig（无扩展、无补丁）；
 * label 内置在 JS 里，按系统语言输出简中/繁中/英文。
 * 实现：经 PowerShell 调 IE 的 COM 对象（InternetExplorer.Application）拉起真 IE 窗口
 *（Gecko 无法渲染 IE 内容，只能交给系统 IE）。
 */
(function () {
  try {
    if (Services.appinfo.OS !== "WINNT") {
      return; // 仅 Windows
    }

    const MENU_ID = "vantage-open-ie";
    const TAB_MENU_ID = "vantage-open-ie-tab";

    function tr() {
      let loc = "";
      try { loc = Services.locale.appLocaleAsBCP47 || ""; } catch (e) {}
      if (loc.startsWith("zh-Hant") || loc.startsWith("zh-TW") || loc.startsWith("zh-MS")) {
        return "在 IE 中開啟";
      }
      if (loc.startsWith("zh")) {
        return "在 IE 中打开";
      }
      return "Open in IE";
    }

    function isHttp(url) {
      return /^https?:/i.test(url || "");
    }

    function openInIE(url) {
      if (!isHttp(url)) {
        return;
      }
      try {
        // 经 conhost --headless 启动，避免 console 窗口闪一下
        //（nsIProcess 用 dwCreationFlags=0，直接从 GUI 进程启 console 程序会新建控制台窗口）。
        let sysDir = Services.dirsvc.get("SysD", Components.interfaces.nsIFile);
        let exe = sysDir.clone();
        exe.append("conhost.exe");
        let ps = sysDir.clone();
        ps.append("WindowsPowerShell");
        ps.append("v1.0");
        ps.append("powershell.exe");
        if (!exe.exists() || !ps.exists()) {
          return;
        }
        let proc = Components.classes["@mozilla.org/process/util;1"]
          .createInstance(Components.interfaces.nsIProcess);
        proc.init(exe);
        let script =
          "$ie = New-Object -ComObject InternetExplorer.Application; " +
          "$ie.Visible = $true; " +
          "$ie.Navigate('" + String(url).replace(/'/g, "''") + "')";
        let args = ["--headless", ps.path, "-NoProfile", "-NonInteractive", "-Command", script];
        proc.run(false, args, args.length);
      } catch (e) {
        dump("Vantage open-in-ie failed: " + e + "\n");
      }
    }

    function contentUrl(win) {
      let cm = win.gContextMenu;
      if (cm && cm.onLink && cm.linkURL) {
        return cm.linkURL;
      }
      let uri = win.gBrowser && win.gBrowser.currentURI;
      return uri ? uri.spec : "";
    }

    function tabUrl(win) {
      let tab = win.TabContextMenu && win.TabContextMenu.contextTab;
      let uri = tab && tab.linkedBrowser ? tab.linkedBrowser.currentURI : null;
      return uri ? uri.spec : "";
    }

    function initWindow(win) {
      let doc = win.document;
      if (!doc) return;

      // 内容区右键（放进复制粘贴组末尾分隔符之前）
      let menu = doc.getElementById("contentAreaContextMenu");
      if (menu && !doc.getElementById(MENU_ID)) {
        let item = doc.createXULElement("menuitem");
        item.id = MENU_ID;
        item.setAttribute("label", tr());
        menu.addEventListener("popupshowing", (e) => {
          if (e.target !== menu) return;
          let url = contentUrl(win);
          item.setAttribute("data-ie-url", url);
          item.hidden = !isHttp(url);
        });
        item.addEventListener("command", () => {
          let url = item.getAttribute("data-ie-url") || contentUrl(win);
          openInIE(url);
        });
        let anchor = doc.getElementById("context-sep-selectall");
        if (anchor && anchor.parentNode === menu) {
          menu.insertBefore(item, anchor);
        } else {
          menu.appendChild(item);
        }
      }

      // 标签页右键（跟在“复制标签页”近旁）
      let tabMenu = doc.getElementById("tabContextMenu");
      if (tabMenu && !doc.getElementById(TAB_MENU_ID)) {
        let titem = doc.createXULElement("menuitem");
        titem.id = TAB_MENU_ID;
        titem.setAttribute("label", tr());
        tabMenu.addEventListener("popupshowing", (e) => {
          if (e.target !== tabMenu) return;
          let url = tabUrl(win);
          titem.setAttribute("data-ie-url", url);
          titem.hidden = !isHttp(url);
        });
        titem.addEventListener("command", () => {
          let url = titem.getAttribute("data-ie-url") || tabUrl(win);
          openInIE(url);
        });
        let dup = doc.getElementById("context_duplicateTabs") ||
                  doc.getElementById("context_duplicateTab");
        if (dup && dup.parentNode === tabMenu) {
          dup.after(titem);
        } else {
          tabMenu.appendChild(titem);
        }
      }
    }

    Services.obs.addObserver(
      { observe(subject, topic, data) {
        if (topic !== "browser-delayed-startup-finished") return;
        try {
          let win = subject;
          if (!win || !win.document) {
            win = Services.wm.getMostRecentWindow("navigator:browser");
          }
          if (win) initWindow(win);
        } catch (e) {
          dump("Vantage open-in-ie init failed: " + e + "\n");
        }
      }},
      "browser-delayed-startup-finished"
    );
  } catch (e) {
    dump("Vantage open-in-ie setup failed: " + e + "\n");
  }
})();

/** ------------------------------- *
 * Vantage: 查找栏选项收进折叠行 + Chromium 式紧凑计数
 *
 * 配合 vantage.findbar.topright（右上角悬浮查找栏）：
 *   1. findbar 的 4 个复选框（全部高亮 / 区分大小写 / 匹配变音符 / 全词匹配）
 *      搬进可折叠的第二行，由「⋮」按钮展开/收起；
 *   2. 把「第 x 项，共 y 项」长句换成输入框旁紧凑的「x/y」（未找到 → 0/0）。
 * pref 关闭时不注入，保持 Firefox 原生。
 * ------------------------------- */
(function () {
  try {
    const PREF = "vantage.findbar.topright";
    const MARK = "vantage-options-menu";
    const BOXES = [
      "highlight",
      "find-case-sensitive",
      "find-match-diacritics",
      "find-entire-word",
    ];

    function cb(findbar, name) {
      return findbar.querySelector('[anonid="' + name + '"]');
    }

    // 还原：复选框搬回原容器，删掉按钮 / 折叠行 / 紧凑计数
    function undecorate(findbar) {
      const home = findbar._vantageOptionsHome;
      if (!home) {
        return;
      }
      const mo = findbar._vantageOptionsObserver;
      if (mo) {
        mo.disconnect();
        delete findbar._vantageOptionsObserver;
      }
      for (const name of BOXES) {
        const box = cb(findbar, name);
        if (box && box.parentNode !== home) {
          home.appendChild(box);
        }
      }
      for (const sel of [
        ".findbar-options-button",
        ".vantage-findbar-options-row",
        ".vantage-findbar-counter",
      ]) {
        const el = findbar.querySelector(sel);
        if (el) {
          el.remove();
        }
      }
      delete findbar._vantageOptionsHome;
      findbar.removeAttribute(MARK);
    }

    function decorate(findbar) {
      if (!findbar || findbar.hasAttribute(MARK)) {
        return;
      }
      const first = cb(findbar, BOXES[0]);
      if (!first) {
        return;
      }
      const doc = findbar.ownerDocument;
      // 记住原先的父节点，便于关闭 pref 时还原
      findbar._vantageOptionsHome = first.parentNode;

      // 折叠行：默认隐藏，点「⋮」展开成第二行
      const row = doc.createXULElement("hbox");
      row.className = "vantage-findbar-options-row";
      row.hidden = true;
      for (const name of BOXES) {
        const item = cb(findbar, name);
        if (item) {
          row.appendChild(item);
        }
      }

      const btn = doc.createXULElement("toolbarbutton");
      btn.className = "findbar-options-button tabbable";
      btn.setAttribute("data-l10n-id", "vantage-findbar-options-button");
      btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("command", () => {
        row.hidden = !row.hidden;
        btn.setAttribute("aria-expanded", row.hidden ? "false" : "true");
      });

      const close = findbar.querySelector('[anonid="find-closebutton"]');
      if (close) {
        findbar.insertBefore(btn, close);
      } else {
        findbar.appendChild(btn);
      }
      findbar.appendChild(row);

      // Chromium 式紧凑计数：3/12（未找到 → 0/0）
      const field = cb(findbar, "findbar-textbox");
      const wrapper = cb(findbar, "findbar-textbox-wrapper");
      const prevBtn = cb(findbar, "find-previous");
      const counter = doc.createXULElement("label");
      counter.className = "vantage-findbar-counter";
      if (wrapper) {
        if (prevBtn && prevBtn.parentNode === wrapper) {
          wrapper.insertBefore(counter, prevBtn);
        } else {
          wrapper.appendChild(counter);
        }
      }

      const foundMatches = cb(findbar, "found-matches");
      const refresh = () => {
        if (!findbar.hasAttribute(MARK)) {
          return;
        }
        let text = "";
        const notfound = !!field && field.getAttribute("status") === "notfound";
        if (notfound) {
          text = "0/0";
        } else if (foundMatches && !foundMatches.hidden) {
          let args = {};
          try {
            args = JSON.parse(foundMatches.getAttribute("data-l10n-args") || "{}");
          } catch (e) {
            args = {};
          }
          if (typeof args.total === "number" && args.total > 0) {
            text = (args.current || 0) + "/" + args.total;
          } else if (typeof args.limit === "number" && args.limit > 0) {
            text = args.limit + "+";
          }
        }
        if (counter.textContent !== text) {
          counter.textContent = text;
        }
        counter.toggleAttribute("notfound", notfound);

        // 搜索选项（区分大小写 / 变音符 / 全词）打开时，让「⋮」按钮高亮提示
        const optionsOn = [
          "find-case-sensitive",
          "find-match-diacritics",
          "find-entire-word",
        ].some(name => {
          const box = cb(findbar, name);
          return box && box.checked;
        });
        btn.toggleAttribute("options-active", optionsOn);
      };

      // 复选框自身变化（XUL 可能只改属性）也要刷新
      for (const name of BOXES) {
        const item = cb(findbar, name);
        if (item) {
          item.addEventListener("command", refresh);
        }
      }

      findbar.setAttribute(MARK, "true");

      const win = doc.defaultView;
      if (win && win.MutationObserver) {
        const mo = new win.MutationObserver(refresh);
        mo.observe(findbar, {
          subtree: true,
          attributes: true,
          attributeFilter: [
            "data-l10n-args",
            "data-l10n-id",
            "hidden",
            "status",
            "value",
            "checked",
          ],
        });
        findbar._vantageOptionsObserver = mo;
      }
      refresh();
    }

    function sync(findbar) {
      if (!findbar || !findbar.ownerDocument) {
        return;
      }
      try {
        if (Services.prefs.getBoolPref(PREF, false)) {
          decorate(findbar);
        } else {
          undecorate(findbar);
        }
      } catch (e) {
        dump("Vantage findbar options: " + e + "\n");
      }
    }

    function initWindow(win) {
      for (const findbar of win.document.querySelectorAll("findbar")) {
        sync(findbar);
      }
      // 之后新建的 findbar：tabbrowser 在 tab 上派发 TabFindInitialized（冒泡）
      if (win._vantageFindbarHooked) {
        return;
      }
      win._vantageFindbarHooked = true;
      win.addEventListener(
        "TabFindInitialized",
        event => {
          const tab = event.target;
          if (tab && tab._findBar) {
            sync(tab._findBar);
          }
        },
        true
      );
    }

    Services.obs.addObserver(
      { observe(subject, topic) {
        if (topic !== "browser-delayed-startup-finished") {
          return;
        }
        try {
          let win = subject;
          if (!win || !win.document || !win.gBrowser) {
            win = Services.wm.getMostRecentWindow("navigator:browser");
          }
          if (win) {
            initWindow(win);
          }
        } catch (e) {
          dump("Vantage findbar options init failed: " + e + "\n");
        }
      }},
      "browser-delayed-startup-finished"
    );

    // pref 切换时对已打开的窗口实时生效
    Services.prefs.addObserver(PREF, {
      observe() {
        for (const win of Services.wm.getEnumerator("navigator:browser")) {
          try {
            initWindow(win);
          } catch (e) {
            // 忽略单个窗口失败
          }
        }
      },
    });
  } catch (e) {
    dump("Vantage findbar options setup failed: " + e + "\n");
  }
})();
